[package]
name = "paveconel"
version = "0.1.1"
edition = "2021"
description = "Pavilion EC Control Panel - embedded-controller fan control for HP Pavilion Gaming 15-ec1xxx"

[dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Console",
    "Win32_System_LibraryLoader",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
toml = "0.8"
evalexpr = "11"
ctrlc = "3"

[profile.release]
strip = true
lto = true